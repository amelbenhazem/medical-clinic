# Placeholder only — do not put real API keys in Git.
# For a real cluster, create the secret from environment variables:
#
# kubectl create secret generic nextjs-secrets -n nextjs-app \
#   --from-literal=NEXT_PUBLIC_SUPABASE_URL="..." \
#   --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY="..." \
#   --from-literal=SUPABASE_SERVICE_ROLE_KEY="..." \
#   --from-literal=GOOGLE_GEMINI_API_KEY="..."
apiVersion: v1
kind: Secret
metadata:
  name: nextjs-secrets
  namespace: nextjs-app
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "your-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "your-service-role-key"
  GOOGLE_GEMINI_API_KEY: "your-gemini-api-key"
